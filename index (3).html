<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autismecenter - Book nu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 40px;
    }

    #Anywhere_button_iframe {
      background-color: #fff !important;
      color: #000 !important;
      border: none;
      padding: 16px 40px !important;
      font-size: 16px !important;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #Anywhere_button_iframe:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h1>Autismecenter</h1>
  <p>Book din tid hurtigt og nemt</p>

  <script id="anywhere_book_now_script" src="https://assets.setmore.com/integration/book-now/live/v1/anywhere-book-now.js"></script>
  <button id="Anywhere_button_iframe" class="anywhere-book-now-button" data-booking-url="https://knprovidercrz6.setmore.com" data-new-tab="false">
    Book nu
  </button>

</html>
