<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autismecenter - Book nu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #aaa;
      margin-bottom: 40px;
    }

    .book-btn {
      background-color: #fff;
      color: #000;
      border: none;
      padding: clamp(12px, 3vw, 16px) clamp(24px, 6vw, 40px);
      font-size: clamp(14px, 3vw, 16px);
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
      width: auto;
      max-width: 300px;
      width: 100%;
    }

    .book-btn:hover {
      opacity: 0.85;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <h1>Autismecenter</h1>
  <p>Book din tid hurtigt og nemt</p>

  <script id="anywhere_book_now_script" src="https://assets.setmore.com/integration/book-now/live/v1/anywhere-book-now.js"></script>
  <button id="Anywhere_button_iframe" class="anywhere-book-now-button book-btn" data-booking-url="https://knprovidercrz6.setmore.com" data-new-tab="false">
    Book nu
  </button>

</body>
</html>
