<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autismecenter - Book nu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #aaa;
      margin-bottom: 40px;
    }

    .book-btn {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s;
      max-width: 300px;
      width: 100%;
    }

    .book-btn:hover {
      opacity: 0.85;
    }

    /* Tving Setmore popup til at fylde hele skærmen */
    #setmore-booking-container,
    .setmore-booking-container,
    iframe[src*="setmore"],
    div[id*="setmore"] iframe,
    .anywhere-book-now-wrapper iframe,
    #anywhere_book_now_wrapper iframe {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      top: 0 !important;
      left: 0 !important;
      position: fixed !important;
      z-index: 9999 !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <h1>Autismecenter</h1>
  <p>Book din tid hurtigt og nemt</p>

  <script id="anywhere_book_now_script" src="https://assets.setmore.com/integration/book-now/live/v1/anywhere-book-now.js"></script>
  <button id="Anywhere_button_iframe" class="anywhere-book-now-button book-btn" data-booking-url="https://knprovidercrz6.setmore.com" data-new-tab="false">
    Book nu
  </button>

  <script>
    // Observer der venter på Setmore popup og tvinger den til fuld skærm
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.nodeName === 'IFRAME' || (node.querySelector && node.querySelector('iframe'))) {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
              iframe.style.cssText = 'width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;top:0!important;left:0!important;position:fixed!important;z-index:9999!important;border:none!important;';
            });
            var divs = document.querySelectorAll('div[style*="position"]');
            divs.forEach(function(div) {
              if (div.querySelector('iframe')) {
                div.style.cssText = 'width:100vw!important;height:100vh!important;top:0!important;left:0!important;position:fixed!important;z-index:9998!important;';
              }
            });
          }
        });
      });
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>

</body>
</html>
